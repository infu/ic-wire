[package]
name = "ic-wire-compatibility"
autotests = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Independent codec contract qualification for Wire"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
fuzz = ["dep:libfuzzer-sys"]
ic = ["dep:ic-platform-runtime"]
candid-comparison = ["dep:candid"]
typescript = [
    "wire/service-client",
    "wire/api-manifest",
    "wire/platform-types",
    "dep:ic-wire-consumer",
    "ic-wire-consumer/schema",
]

[dependencies]
candid = { workspace = true, features = ["serde_bytes"], optional = true }
ic-platform-runtime = { workspace = true, optional = true, features = ["system-raw"] }
ic-wire-consumer = { workspace = true, optional = true }
libfuzzer-sys = { workspace = true, optional = true }

[dev-dependencies]
ic-platform-types.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
stats_alloc.workspace = true
toko-tooling.workspace = true
wire = { workspace = true, features = ["derive"] }

[[test]]
name = "compatibility"
path = "tests/compatibility_tests.rs"

[[test]]
name = "allocation"
path = "tests/allocation_tests.rs"
harness = false

[[test]]
name = "typescript"
path = "tests/typescript_tests.rs"
required-features = ["typescript"]

[[test]]
name = "codec_contracts"
path = "tests/codec_contract_tests.rs"

[[test]]
name = "candid_matrix"
path = "tests/candid_matrix.rs"
required-features = ["candid-comparison"]

[lints]
workspace = true

[[example]]
name = "numeric-bounded"
path = "examples/numeric/bounded_allocations.rs"

[[example]]
name = "numeric-ordinary"
path = "examples/numeric/ordinary_allocations.rs"

[[example]]
name = "numeric-packed"
path = "examples/numeric/packed_allocations.rs"

[[example]]
name = "numeric-candid"
path = "examples/numeric/candid_allocations.rs"
required-features = ["candid-comparison"]

[[example]]
name = "numeric-ordinary-ic"
path = "examples/numeric/ordinary_ic.rs"
crate-type = ["cdylib"]
required-features = ["ic"]

[[example]]
name = "numeric-bounded-ic"
path = "examples/numeric/bounded_ic.rs"
crate-type = ["cdylib"]
required-features = ["ic"]

[[example]]
name = "numeric-packed-ic"
path = "examples/numeric/packed_ic.rs"
crate-type = ["cdylib"]
required-features = ["ic"]

[[example]]
name = "numeric-candid-ic"
path = "examples/numeric/candid_ic.rs"
crate-type = ["cdylib"]
required-features = ["ic", "candid-comparison"]

[[example]]
name = "fuzz-decode"
path = "examples/fuzz_decode.rs"
required-features = ["fuzz"]
