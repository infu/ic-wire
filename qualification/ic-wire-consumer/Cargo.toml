[package]
name = "ic-wire-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Standalone portable request/response consumer for Wire qualification"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "wire-consumer"
path = "src/bin/workload.rs"

[[bin]]
name = "wire-consumer-generate"
path = "src/bin/generate.rs"
required-features = ["schema"]

[features]
schema = ["wire/typescript"]
ic = ["dep:ic-platform-runtime"]
evolution-qualification = ["schema", "wire/api-manifest"]
evolution-b-only = []
evolution-caller-buffer = []

[dependencies]
ic-platform-runtime = { workspace = true, optional = true, features = ["system-raw"] }
serde.workspace = true
wire = { workspace = true, features = ["derive"] }

[dev-dependencies]
ic-platform-types.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true

[[example]]
name = "upload-manifest"
path = "examples/upload_manifest.rs"
required-features = ["schema", "wire/api-manifest"]

[[example]]
name = "platform-schema"
path = "examples/platform_schema.rs"
required-features = ["schema", "wire/platform-types"]

[[example]]
name = "instruction-counter"
path = "src/ic.rs"
crate-type = ["cdylib"]
required-features = ["ic"]

[[example]]
name = "raw-service"
path = "examples/raw_service.rs"
crate-type = ["cdylib"]
required-features = ["ic"]

[[example]]
name = "generate-service"
path = "examples/generate_service.rs"
required-features = ["wire/service-client"]

[[example]]
name = "evolution-contract"
path = "examples/evolution_contract/main.rs"
required-features = ["evolution-qualification"]

[[example]]
name = "evolution-contract-ic"
path = "examples/evolution_contract/guest.rs"
crate-type = ["cdylib"]
required-features = ["ic", "evolution-qualification"]

[[example]]
name = "evolution-reader-a"
path = "examples/evolution_contract/reader_a.rs"
required-features = ["evolution-qualification"]

[[example]]
name = "evolution-upgrade"
path = "examples/evolution_contract/upgrade.rs"
required-features = ["evolution-qualification"]
