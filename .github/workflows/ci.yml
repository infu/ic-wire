name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  lint-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned CI tools
        run: |
          for tool in actionlint shellcheck gitleaks; do
            perl scripts/ci/setup-diagnostics.pl "install-$tool" bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh "$tool" \
              --install-dir "$RUNNER_TEMP/wire-ci-bin"
          done
          echo "$RUNNER_TEMP/wire-ci-bin" >> "$GITHUB_PATH"
      - name: Check workflow and hook caller
        run: |
          actionlint .github/workflows/ci.yml
          shellcheck scripts/ci/check-formatting-hooks.sh
      - name: Scan complete repository history once
        run: gitleaks git --redact=100 --no-banner --no-color --log-level error
      - name: Retain sanitized setup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wire-diagnostics/*.txt
          retention-days: 7
          if-no-files-found: warn

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare pinned host tools
        run: |
          perl scripts/ci/setup-diagnostics.pl host-tools make install-host-tools host-tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Prepare declared Rust compiler and targets
        run: |
          perl scripts/ci/setup-diagnostics.pl rust-toolchain bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Prepare and admit pinned Rust tools
        run: perl scripts/ci/setup-diagnostics.pl rust-tools make install-rust-tools rust-tools-check
      - name: Fetch locked dependencies for all maintained workspaces
        run: |
          perl scripts/ci/setup-diagnostics.pl fetch-product cargo fetch --locked
          perl scripts/ci/setup-diagnostics.pl fetch-qualification cargo fetch --locked --manifest-path qualification/Cargo.toml
      - name: Admit snapshots, pins and formatting
        run: make qualification-tooling-check fmt-check
      - name: Qualify shared formatting hook against Wire inputs
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          perl scripts/ci/setup-diagnostics.pl formatting-hook make check-formatting-hooks
      - name: Check portable codec, host schemas and derive diagnostics
        run: |
          make lint lint-host lint-compatibility doc doc-host
          cargo clippy -p ic-wire --features derive,typescript --lib --test derive_tests --locked -- -D warnings
          make test test-host test-compatibility
          cargo test -p ic-wire --features derive,typescript --test derive_tests --locked
      - name: Check sparse evolution and upgrade manifests
        run: make test-evolution
      - name: Check Wire and Candid comparison matrix
        if: runner.os == 'Linux'
        run: cargo test --manifest-path qualification/Cargo.toml -p ic-wire-compatibility --features candid-comparison --test candid_matrix --locked
      - name: Check native instruction driver without a simulator
        if: runner.os == 'Linux'
        run: make lint-instructions doc-instructions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Linux'
        with:
          node-version: '24.21.0'
      - name: Prepare locked TypeScript compiler
        if: runner.os == 'Linux'
        run: perl scripts/ci/setup-diagnostics.pl typescript npm ci --prefix qualification/typescript --ignore-scripts --no-audit --no-fund
      - name: Check strict generated clients and Rust/TypeScript exchange
        if: runner.os == 'Linux'
        run: make lint-typescript check-typescript check-evolution-typescript check-api-manifest
      - name: Check portable Wasm and execute standalone consumer
        if: runner.os == 'Linux'
        run: |
          make check-wasm check-wasm-host check-consumer-wasm
          cargo clippy --manifest-path qualification/Cargo.toml -p ic-wire-consumer \
            --features ic --example instruction-counter --target wasm32-unknown-unknown \
            --locked -- -D warnings
          cargo clippy --manifest-path qualification/Cargo.toml -p ic-wire-compatibility \
            --features ic,candid-comparison --target wasm32-unknown-unknown \
            --example numeric-ordinary-ic --example numeric-bounded-ic \
            --example numeric-packed-ic --example numeric-candid-ic --locked -- -D warnings
      - name: Retain sanitized setup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wire-diagnostics/*.txt
          retention-days: 7
          if-no-files-found: warn
