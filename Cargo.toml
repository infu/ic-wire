[workspace]
members = ["crates/ic-wire", "crates/ic-wire-derive"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.31.1"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Production
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
ic-platform-types = { version = "0.21.2", default-features = false }
# Generated macro output uses the coordinated runtime API; see AGENTS.md.
ic-wire-derive = { path = "crates/ic-wire-derive", version = "=0.31.1" }
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
syn = "3.0.10"

# Production and tests
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }

# Tests and tooling
toko-tooling = "=0.46.7"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
